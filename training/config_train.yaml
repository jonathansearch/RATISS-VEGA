# ⚙️ RATISS VEGA — Training Config
# Fits on CPU / single GPU with grad accumulation. Scales to cluster via accelerate.

model:
  config: "../model/config.json"   # 28L / 960H / 32k vocab / 3 experts
  dtype: "bfloat16"

tokenizer:
  path: "../tokenizer"             # after train_tokenizer.py

data:
  train_corpus: "../tokenizer/corpus_sample.txt"  # replace with your large corpus (10B tokens)
  val_corpus: "../tokenizer/corpus_sample.txt"
  block_size: 4096
  streaming: true

training:
  output_dir: "./checkpoints/vega-360M"
  num_steps: 50000          # ~20B tokens at 400k tok/step
  batch_size: 4             # per device
  grad_accum: 32            # effective 128
  learning_rate: 3.0e-4
  warmup_steps: 1000
  weight_decay: 0.1
  max_grad_norm: 1.0
  log_every: 50
  save_every: 2000
  eval_every: 1000
  dtype: "bfloat16"
  optimizer: "adamw"
  scheduler: "cosine"

# VEGA-specific
router:
  aux_loss_coef: 0.01
  temperature: 0.3

gguf:
  convert_after_train: true
  quantization:
    - "q4_k_m"
    - "q5_k_m"
    - "f16"
